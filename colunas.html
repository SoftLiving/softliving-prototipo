<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colunas · SoftLiving (Protótipo · versão 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body data-page="colunas" data-root="">

<!-- Tela Colunas (referência: página de colunistas do site, softliving.com.br/app/colunistas):
     coluna do dia com sugestões, colunistas por categoria, navegue por autor e colunas em destaque -->
<div class="page-head">
  <h1><span class="hl">Colunas</span></h1>
  <p>Perspectivas de quem sabe: cultura, saúde, longevidade e vida ativa. Leia a última coluna de cada autor gratuitamente; o arquivo está disponível com saldo na carteira.</p>
  <button type="button" class="btn ghost" id="colArquivo"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>Ver arquivo completo de colunas</button>
</div>

<!-- Coluna do dia + 4 sugestões no mesmo box -->
<section class="coluna-dia" id="colDia" data-lateral-topo></section>

<section class="secao">
  <div class="head"><div><h2>Todos os colunistas</h2></div></div>
  <!-- Fichário: uma aba por categoria (nome curto), colunistas dentro do painel -->
  <div class="tabs folder" id="colCategorias" role="tablist"></div>
  <div class="folder-panel"><div class="colunistas" id="colunistas"></div></div>
</section>

<section class="secao">
  <div class="head"><div><h2>Navegue por autor</h2><p id="colConta"></p></div></div>
  <div class="autores" id="colAutores"></div>
</section>

<section class="secao" id="colLista">
  <div class="head"><div><h2 id="colTitulo">Colunas em destaque</h2><p id="colSub"></p></div><button type="button" class="btn ghost" id="colTodas" hidden>Ver todas as colunas</button></div>
  <div class="grade" id="colGrade"></div>
</section>

<!-- Patrocinador apoiador (um só por página): sorteado a cada visita (layout.js) -->
<div class="apoio"></div>

<!-- Coluna lateral da direita (montada por lateral.js) -->
<aside class="lateral" aria-label="Coluna lateral"></aside>

<script src="assets/js/layout.js"></script>
<script src="assets/js/conteudos-dados.js"></script>
<script src="assets/js/colunas-dados.js"></script>
<script src="assets/js/grupos-dados.js"></script>
<script src="assets/js/lateral.js"></script>
<script src="assets/js/escuta-dados.js"></script>
<script src="assets/js/escuta.js"></script>
<script src="assets/js/colunas.js"></script>
</body>
</html>
