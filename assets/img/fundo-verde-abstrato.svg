<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Fundo verde abstrato das páginas que pedem login: manchas de verde desfocadas e duas ondas de luz suaves -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc58a"/>
      <stop offset=".45" stop-color="#4f8a3c"/>
      <stop offset="1" stop-color="#1f4a1c"/>
    </linearGradient>
    <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="desfoqueLeve" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#desfoque)">
    <ellipse cx="260" cy="160" rx="520" ry="360" fill="#d8eec4" opacity=".85"/>
    <ellipse cx="1500" cy="140" rx="460" ry="300" fill="#b9dc8e" opacity=".7"/>
    <ellipse cx="980" cy="560" rx="560" ry="300" fill="#6fae4f" opacity=".75"/>
    <ellipse cx="1760" cy="760" rx="420" ry="380" fill="#2c6b2a" opacity=".9"/>
    <ellipse cx="220" cy="900" rx="520" ry="300" fill="#1c4419" opacity=".85"/>
    <ellipse cx="1240" cy="1000" rx="480" ry="220" fill="#a7d27a" opacity=".45"/>
  </g>
  <g filter="url(#desfoqueLeve)" fill="none" stroke-linecap="round">
    <path d="M-100 700 C 400 520, 800 880, 1300 640 S 2000 520, 2100 600" stroke="#e6f5d4" stroke-width="70" opacity=".35"/>
    <path d="M-100 380 C 500 240, 900 520, 1400 330 S 2000 260, 2100 300" stroke="#cfe9b4" stroke-width="40" opacity=".3"/>
  </g>
</svg>
