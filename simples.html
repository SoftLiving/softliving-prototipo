<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modo simples · SoftLiving (Protótipo · em aprovação)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body class="sm-body">

<!-- Modo simples: poucas opções grandes, uma tarefa por tela, letra maior e sempre o mesmo botão de voltar.
     Não usa o layout.js (sem menu lateral nem menu do topo). As telas são montadas por assets/js/simples.js. -->
<div class="proto-strip" role="note">
  <strong>PROTÓTIPO · EM APROVAÇÃO</strong>
  <span>Dados fictícios · sem vínculo com as marcas</span>
</div>

<header class="sm-header">
  <a class="brand" href="simples.html" aria-label="SoftLiving, início do modo simples"><span class="soft">Soft</span><span class="living">Living</span></a>
  <div class="sm-header-actions">
    <div class="sm-fontsize" role="group" aria-label="Tamanho da letra">
      <span>Letra</span>
      <button type="button" data-escala="-1" aria-label="Diminuir a letra">A−</button>
      <button type="button" data-escala="1" aria-label="Aumentar a letra">A+</button>
    </div>
    <a class="sm-top-btn" href="#ajuda">Ajuda</a>
    <a class="sm-top-btn sm-top-full" href="inicio.html" id="smModoCompleto">Modo completo</a>
  </div>
</header>

<main class="sm-main" id="sm" aria-live="polite"></main>

<footer class="sm-footer">Protótipo conceitual SoftLiving. Conteúdos, dados e pessoas são fictícios.</footer>

<script src="assets/js/comum.js"></script>
<script src="assets/js/conteudos-dados.js"></script>
<script src="assets/js/grupos-dados.js"></script>
<script src="assets/js/simples.js"></script>
</body>
</html>
