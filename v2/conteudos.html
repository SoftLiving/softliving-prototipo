<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conteúdos · SoftLiving (Protótipo · versão 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body data-page="conteudos" data-root="">

<!-- Tela Conteúdos (referência: conteudos.html da versão 1): busca, destaque, assuntos, Todos/Grátis/Premium e grade -->
<div class="page-head">
  <h1>Conteúdos e <span class="hl">Curadoria</span></h1>
  <p>Artigos, guias e dicas sobre saúde, longevidade, tecnologia e muito mais.</p>
</div>

<label class="busca" data-lateral-topo>
  <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input type="search" id="ctBusca" placeholder="Buscar por título, autor ou tema..." aria-label="Buscar conteúdos">
</label>

<a href="#" class="destaque-largo" id="ctDestaque"></a>

<section class="secao" id="ctLista">
  <!-- Fichário: um assunto por aba -->
  <div class="tabs folder" id="ctAssuntos" role="tablist"></div>
  <div class="folder-panel">
    <div class="seg" id="ctTipos" role="tablist"></div>
    <div class="grade" id="ctGrade"></div>
    <p class="vazio" id="ctVazio" hidden>Nenhum conteúdo encontrado com esses filtros.</p>
  </div>
</section>

<!-- Patrocinador apoiador (um só por página): sorteado a cada visita (layout.js) -->
<div class="apoio"></div>

<!-- Coluna lateral da direita (montada por lateral.js) -->
<aside class="lateral" aria-label="Coluna lateral"></aside>

<script src="assets/js/layout.js"></script>
<script src="assets/js/conteudos-dados.js"></script>
<script src="assets/js/grupos-dados.js"></script>
<script src="assets/js/lateral.js"></script>
<script src="assets/js/escuta-dados.js"></script>
<script src="assets/js/escuta.js"></script>
<script src="assets/js/conteudos.js"></script>
</body>
</html>
