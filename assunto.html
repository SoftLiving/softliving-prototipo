<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assunto · Conteúdos · SoftLiving (Protótipo · versão 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilos.css?v=202610070236">
<link rel="stylesheet" href="assets/css/vitrine.css?v=202610070236">
<link rel="stylesheet" href="assets/css/conteudos.css?v=202610070236">
</head>
<body data-page="conteudos" data-root="">

<!-- Página de um assunto (Bem-estar, Saúde, Estilo e casa, Viagem, Tecnologia, SoftLiving): assunto.html?a=<endereço>.
     Estrutura padrão das páginas de segmento de conteúdo, nesta ordem: BEDH, BDELD, BSD, BDDLE e BDS.
     Tudo é montado por assunto.js; a ordem dos conteúdos é sorteada a cada visita. -->
<div class="page-head">
  <p class="kicker" id="asKicker">Assunto</p>
  <h1 id="asTitulo"></h1>
  <p id="asFrase"></p>
</div>

<!-- MSC · Menu segmentos conteúdo: todos os assuntos em círculos (o atual marcado), para trocar de assunto -->
<nav class="vt-categorias" id="asCirculos" aria-label="Assuntos" data-lateral-topo></nav>

<!-- 1) BEDH · Box em destaque horizontal -->
<section class="vt-bloco" id="asBEDH" data-box="BEDH"></section>

<!-- 2) BDELD · Box destaque esquerda lista direita -->
<section class="vt-bloco seg-box" id="asBDELD" data-box="BDELD"></section>

<!-- 3) BSD · Box super destaque -->
<section class="vt-bloco" id="asBSD" data-box="BSD"></section>

<!-- Patrocinador apoiador (um só por página): sorteado a cada visita (layout.js) -->
<div class="apoio"></div>

<!-- 4) BDDLE · Box destaque direita lista esquerda -->
<section class="vt-bloco seg-box" id="asBDDLE" data-box="BDDLE"></section>

<!-- 5) BDS · Box destaque simples -->
<section class="vt-bloco" id="asBDS" data-box="BDS"></section>

<!-- Coluna lateral da direita (montada por lateral.js) -->
<aside class="lateral" aria-label="Coluna lateral"></aside>

<script src="assets/js/texto.js?v=202610070236"></script>
<script src="assets/js/layout.js?v=202610070236"></script>
<script src="assets/js/conteudos-dados.js?v=202610070236"></script>
<script src="assets/js/grupos-dados.js?v=202610070236"></script>
<script src="assets/js/lateral.js?v=202610070236"></script>
<script src="assets/js/escuta-dados.js?v=202610070236"></script>
<script src="assets/js/escuta.js?v=202610070236"></script>
<script src="assets/js/conteudos-cartoes.js?v=202610070236"></script>
<script src="assets/js/assunto.js?v=202610070236"></script>
</body>
</html>
