     MSV (Menu segmento vitrine) e pelo box "Perto de você" da Vitrine.
     Estrutura padrão das páginas de segmento de vitrine, nesta ordem: BEDHV, BDELDV, BSD, BDDLEV, BDS, BRPCV e BPDVV.
     Estabelecimentos fictícios. Montada por vitrine-segmento.js. -->

<nav class="vt-categorias" id="vsSegmentos" aria-label="Segmentos das vitrines" data-lateral-topo></nav>

<!-- 1) BEDHV · Box em destaque horizontal vitrine -->
<section class="vt-bloco" id="vsBEDHV" data-box="BEDHV"></section>

<section class="vt-bloco seg-box" id="vsBDELDV" data-box="BDELDV"></section>

<!-- 3) BSD · Box super destaque -->
<section class="vt-bloco" id="vsBSD" data-box="BSD"></section>

<div class="apoio"></div>

<!-- 4) BDDLEV · Box destaque direita lista esquerda vitrine -->
<section class="vt-bloco seg-box" id="vsBDDLEV" data-box="BDDLEV"></section>

<!-- 5) BDS · Box destaque simples -->
<section class="vt-bloco" id="vsBDS" data-box="BDS"></section>

<!-- 6) BRPCV · Box recomendado pela comunidade vitrine -->
<section class="vt-bloco" id="vsBRPCV" data-box="BRPCV"></section>

<!-- 7) BPDVV · Box perto de você vitrine -->
<section class="vt-bloco" id="vsBPDVV" data-box="BPDVV"></section>
